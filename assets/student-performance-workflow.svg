<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Student performance prediction workflow</title>
  <desc id="description">Student background and preparation features flow into a regression model to estimate a mathematics score.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="1" stop-color="#e5f1ef"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#126b70"/>
      <stop offset="1" stop-color="#174f68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#17364a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 10 6 1 11" fill="none" stroke="#397e83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#canvas)"/>
  <circle cx="1080" cy="40" r="120" fill="#c8e5df" opacity=".34"/>
  <circle cx="130" cy="438" r="155" fill="#d5e8f6" opacity=".42"/>
  <text x="64" y="67" fill="#163c4c" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">STUDENT PERFORMANCE · REGRESSION WORKFLOW</text>
  <text x="64" y="104" fill="#52707b" font-family="Segoe UI, Arial, sans-serif" font-size="17">From student context to a math-score estimate</text>
  <g filter="url(#shadow)">
    <rect x="64" y="147" width="308" height="235" rx="18" fill="#fff"/>
    <rect x="446" y="147" width="308" height="235" rx="18" fill="url(#model)"/>
    <rect x="828" y="147" width="308" height="235" rx="18" fill="#fff"/>
  </g>
  <text x="94" y="190" fill="#163c4c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">01 · INPUT FEATURES</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#365564">
    <rect x="94" y="212" width="116" height="34" rx="8" fill="#edf4f5"/><text x="107" y="234">Gender</text>
    <rect x="222" y="212" width="122" height="34" rx="8" fill="#edf4f5"/><text x="235" y="234">Family context</text>
    <rect x="94" y="257" width="116" height="34" rx="8" fill="#edf4f5"/><text x="107" y="279">Lunch type</text>
    <rect x="222" y="257" width="122" height="34" rx="8" fill="#edf4f5"/><text x="235" y="279">Test prep</text>
    <rect x="94" y="302" width="250" height="34" rx="8" fill="#edf4f5"/><text x="107" y="324">Student background attributes</text>
  </g>
  <text x="476" y="190" fill="#d8efea" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">02 · MODEL</text>
  <text x="476" y="244" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Regression</text>
  <text x="476" y="275" fill="#d8efea" font-family="Segoe UI, Arial, sans-serif" font-size="15">Notebook model comparison</text>
  <path d="M486 327h34l20-30 25 20 25-48 25 32 31-19 40 45" fill="none" stroke="#92d8c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="858" y="190" fill="#163c4c" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">03 · PREDICTION TARGET</text>
  <text x="858" y="260" fill="#126b70" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700">Math</text>
  <text x="858" y="292" fill="#365564" font-family="Segoe UI, Arial, sans-serif" font-size="19">score estimate</text>
  <text x="858" y="340" fill="#52707b" font-family="Segoe UI, Arial, sans-serif" font-size="14">A supervised learning task</text>
  <path d="M380 264h48" fill="none" stroke="#397e83" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M762 264h48" fill="none" stroke="#397e83" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
